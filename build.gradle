plugins {
    id 'java'
}

group = 'org.spectralmemories'
version = '0.9.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

java {
    // Compilado con cualquier JDK >= 17, generando bytecode de Java 17 (minimo de Minecraft 1.20.4)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

dependencies {
    // Paper incluye Adventure y MiniMessage; desde 0.9 el plugin es solo para Paper y sus forks
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.9') {
        transitive = false
    }
    compileOnly('com.sk89q.worldguard:worldguard-core:7.0.9') {
        transitive = false
    }
    compileOnly('com.sk89q.worldedit:worldedit-core:7.2.15') {
        transitive = false
    }
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.2.15') {
        transitive = false
    }
    // SnakeYAML y el driver de SQLite ya vienen con el servidor; solo se empaqueta SQLAccess
    implementation files('libs/SQLAccess.jar')
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'BloodMoon'
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    testImplementation 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
